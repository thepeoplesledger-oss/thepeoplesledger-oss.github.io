# ------------------------------------------------------------
# Site Identity
# ------------------------------------------------------------

title: "The People's Ledger"

description: >-
  Independent public-interest journalism investigating power,
  public spending, governance, corruption, and the real-world
  impact of policy decisions on everyday Ghanaians.

url: "https://thepeoplesledger-oss.github.io"
baseurl: ""

minimal_mistakes_skin: default

search: true

github_username: thepeoplesledger-oss

# ------------------------------------------------------------
# Theme
# ------------------------------------------------------------

remote_theme: "mmistakes/minimal-mistakes"

# ------------------------------------------------------------
# Navigation
# ------------------------------------------------------------

navigation:
  - title: "Investigations"
    url: "/investigations/"

  - title: "Ledger File"
    url: "/ledger-file/"

  - title: "People's Brief"
    url: "/peoples-brief/"

  - title: "Weekly Record"
    url: "/weekly-record/"

  - title: "Accountability Tracker"
    url: "/accountability-tracker/"

  - title: "About"
    url: "/about/"

# ------------------------------------------------------------
# Homepage
# ------------------------------------------------------------

home:
  layout: home
  nav: true

# ------------------------------------------------------------
# Defaults
# ------------------------------------------------------------

defaults:

  # Posts

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      nav: true
      author_profile: false
      show_date: true
      read_time: true
      share: true
      related: true
      comments: false

  # Pages

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      show_permalink: false
      read_time: false

# ------------------------------------------------------------
# Build Settings
# ------------------------------------------------------------

markdown: kramdown

permalink: pretty

paginate: 10
paginate_path: /page:num/

timezone: Africa/Accra

include:
  - _pages

# ------------------------------------------------------------
# Plugins
# ------------------------------------------------------------

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-gist
  - jekyll-include-cache

# ------------------------------------------------------------
# Organization Profile
# ------------------------------------------------------------

author:
  name: "The People's Ledger"
  bio: "Independent civic newsroom focused on accountability, transparency, governance, and public-interest reporting."

# ------------------------------------------------------------
# Footer Links
# ------------------------------------------------------------

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/thepeoplesledger-oss"

    - label: "RSS Feed"
      icon: "fas fa-fw fa-rss"
      url: "/feed.xml"

# ------------------------------------------------------------
# Archives
# ------------------------------------------------------------

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# ------------------------------------------------------------
# SEO
# ------------------------------------------------------------

og_image: "/assets/images/ledger-social-card.jpg"

twitter:
  username:
  card: summary_large_image
